<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Eventra</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand">Event<span>ra</span></a>
    <button class="nav-toggle" id="navToggle">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Browse Events</a></li>
      <li><a href="event-detail.html">Event Details</a></li>
      <li><a href="booking.html">Booking</a></li>
      <li><a href="my-tickets.html">My Tickets</a></li>
      <li><a href="admin.html">Admin</a></li>
      <li id="navUserSlot"></li>
    </ul>
  </div>
</nav>

<main class="container section">
<div class="form-card">
  <h2 class="text-center">Create your account</h2>
  <div class="form-error" id="formError"></div>
  <form id="registerForm" novalidate>
    <div class="field"><label for="name">Full name</label><input type="text" id="name" placeholder="Your name" required></div>
    <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" required></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="At least 6 characters" required></div>
    <div class="field"><label for="confirm">Confirm password</label><input type="password" id="confirm" placeholder="Repeat password" required></div>
    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign Up</button>
  </form>
  <p class="form-note">Already registered? <a href="login.html"><b>Login</b></a></p>
</div>
</main>

<footer>
  <div class="container">
    <div>Eventra — Event Management &amp; Ticket Booking Platform</div>
    <div>HTML, CSS, JS &amp; json-server</div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
if (getCurrentUser()) window.location.href = "index.html";

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("formError");
  const btn = document.getElementById("submitBtn");
  err.classList.remove("show");
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const fail = (msg) => { err.textContent = msg; err.classList.add("show"); };

  if (name.length < 2) return fail("Please enter your full name.");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail("Please enter a valid email address.");
  if (password.length < 6) return fail("Password must be at least 6 characters.");
  if (password !== confirm) return fail("Passwords do not match.");

  btn.disabled = true; btn.textContent = "Creating account…";
  try {
    const existing = await apiGet("/users?email=" + encodeURIComponent(email));
    if (existing.length) { btn.disabled = false; btn.textContent = "Sign Up"; return fail("An account with this email already exists."); }
    const user = await apiPost("/users", { name, email, password, role: "user", createdAt: new Date().toISOString() });
    setCurrentUser({ id: user.id, name: user.name, email: user.email, role: user.role });
    window.location.href = "index.html";
  } catch (ex) {
    fail("Could not create account. Is json-server running (npm start)?");
    btn.disabled = false; btn.textContent = "Sign Up";
  }
});
</script>
</body>
</html>
