<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Eventra</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand">Event<span>ra</span></a>
    <button class="nav-toggle" id="navToggle">☰</button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="events.html">Browse Events</a></li>
      <li><a href="event-detail.html">Event Details</a></li>
      <li><a href="booking.html">Booking</a></li>
      <li><a href="my-tickets.html">My Tickets</a></li>
      <li><a href="admin.html">Admin</a></li>
      <li id="navUserSlot"></li>
    </ul>
  </div>
</nav>

<main class="container section">
<div class="form-card">
  <h2 class="text-center">Welcome back</h2>
  <p class="form-note" style="margin-top:0">Sign in to book tickets and see your bookings.</p>
  <div class="form-error" id="formError"></div>
  <form id="loginForm" novalidate>
    <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" required></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="Your password" required></div>
    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Login</button>
  </form>
  <p class="form-note">New here? <a href="register.html"><b>Create an account</b></a></p>
</div>
</main>

<footer>
  <div class="container">
    <div>Eventra — Event Management &amp; Ticket Booking Platform</div>
    <div>HTML, CSS, JS &amp; json-server</div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script>
if (getCurrentUser()) window.location.href = "index.html";

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("formError");
  const btn = document.getElementById("submitBtn");
  err.classList.remove("show");
  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  if (!email || !password) { err.textContent = "Please enter both email and password."; err.classList.add("show"); return; }
  btn.disabled = true; btn.textContent = "Signing in…";
  try {
    const users = await apiGet("/users?email=" + encodeURIComponent(email));
    const user = users.find(u => u.password === password);
    if (!user) throw new Error("Invalid email or password.");
    setCurrentUser({ id: user.id, name: user.name, email: user.email, role: user.role });
    const next = new URLSearchParams(window.location.search).get("redirect");
    window.location.href = next || "index.html";
  } catch (ex) {
    err.textContent = ex.message.startsWith("Request failed") ? "Cannot reach server. Is json-server running (npm start)?" : ex.message;
    err.classList.add("show");
    btn.disabled = false; btn.textContent = "Login";
  }
});
</script>
</body>
</html>
